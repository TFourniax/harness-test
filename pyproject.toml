[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-agent-harness"
version = "0.3.0"
description = "Model-agnostic, evidence-gated, self-improving agent harness with human-governed evolution."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "litellm>=1.90.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
telemetry = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
adaptive-harness = "adaptive_harness.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
