# Replace these role models with any LiteLLM-supported provider/model IDs.
# Diversity between actor and verifier is recommended when practical.
primary:
  model: openrouter/anthropic/claude-sonnet-4.6
  temperature: 0.1
  max_tokens: 6000
  tool_mode: auto
  fallbacks: []
  timeout: 90
  num_retries: 2

# Low-cost worker/orchestrator role. Replace with the best price/quality model for your workload.
cheap:
  model: openrouter/openai/gpt-5-mini
  temperature: 0.1
  max_tokens: 3500

planner:
  model: openrouter/openai/gpt-5.5
  temperature: 0.0
  max_tokens: 5000
verifier:
  model: openrouter/openai/gpt-5.5
  temperature: 0.0
  max_tokens: 2000
critic:
  model: openrouter/openai/gpt-5.5
  temperature: 0.0
  max_tokens: 6000

harness_root: .
workspace: .
trace_db: .harness/traces.sqlite3
memory_db: .harness/memory.sqlite3
max_parallel_agents: 4
max_run_cost_usd: null
allowed_scopes:
  - fs:read
  - fs:write
  - net:read
  - exec:sandbox
approval_risks:
  - external_side_effect
  - privileged
evidence_gate_enabled: true
blind_verification_enabled: true
auto_maintenance_enabled: true
maintenance_scan_runs: 50
maintenance_out: .harness/proposals

# Sparse hierarchical team. A lead plans a dependency DAG; independent specialists run in
# parallel; only material gaps create another bounded round.
team:
  enabled: true
  max_agents: 6
  max_rounds: 3
  max_tasks_per_plan: 8
  worker_max_steps: 18
  orchestrator_role: cheap
  synthesizer_role: primary
  cheap_max_difficulty: 0.62
  utility_floor: 0.18
  target_confidence: 0.86
  max_report_chars: 5000

  semantic_cache_enabled: true
  semantic_cache_db: .harness/team-cache.sqlite3
  semantic_direct_threshold: 0.985
  semantic_reference_threshold: 0.90
  stable_cache_ttl_seconds: 604800
  volatile_cache_ttl_seconds: 600

  # v0.5 Evidence-Grounded Compute Economy. No external backend is required: all stores are
  # local SQLite files and local deterministic feature hashing by default.
  economy:
    enabled: true
    db: .harness/compute-economy.sqlite3

    # Compute strategy learning is evidence weighted. Weak model-only outcomes have very little
    # influence; deterministic postconditions and externally verified outcomes carry more weight.
    min_strategy_samples: 4                # legacy compatibility/statistics only
    min_strategy_evidence_mass: 2.0
    evidence_half_life_days: 45
    exploration_rate: 0.06

    # Transparent cold-start price priors; provider-reported history supersedes them per bucket.
    cold_start_cheap_call_usd: 0.002
    cold_start_primary_call_usd: 0.020
    cost_weight: 3.5
    budget_pressure_weight: 0.35
    min_expected_gain: 0.035
    stop_confidence_floor: 0.82

    normal_success_target: 0.78
    critical_success_target: 0.92
    critical_reliability_penalty: 2.4
    cheap_pair_min_difficulty: 0.48
    primary_preferred_difficulty: 0.82
    critical_mixed_pair_difficulty: 0.78
    cheap_pair_diversity_multiplier: 1.10
    mixed_pair_diversity_multiplier: 1.16

    # Process-aware confidence calibration. The live runtime never labels its own confidence as
    # ground truth. This DB is ready for externally verified/held-out outcomes later.
    confidence_db: .harness/confidence-calibration.sqlite3
    confidence_min_empirical_samples: 12

    # Multi-space local semantic cache: intent / procedure / material entities / full text.
    multi_space_cache_enabled: true
    cache_calibration_min_samples: 8
    cache_precision_target: 0.995
    cache_entity_overlap_direct: 0.90
    cache_procedure_floor_direct: 0.90
    direct_cache_min_evidence_strength: 0.72

    # Compute-policy champion/challenger arena. Live/shadow traces are diagnostic only; a challenger
    # may become promotable only from matched high-evidence benchmark trials, and actual promotion
    # still requires an external governance decision.
    policy_arena_enabled: true
    policy_arena_db: .harness/compute-policy-arena.sqlite3
    policy_min_matched_trials: 12
    policy_evidence_floor: 0.60
    policy_quality_regression_tolerance: 0.01
    policy_quality_gain_target: 0.02
    policy_cost_reduction_target: 0.10
    policy_cost_tolerance: 0.05


# Durable Mission Plane (v0.6): canonical task/fact state lives outside model context.
# Workers can read budgeted slices; only the governed parent receives write tools.
long_horizon:
  enabled: true
  state_db: .harness/task-state.sqlite3
  context_budget_tokens: 3000
  task_done_evidence_strength: 0.60
  fact_evidence_strength: 0.25
  max_tasks_per_mission: 256

# Optional private Telegram control channel. Secrets stay in environment variables.
telegram:
  enabled: false
  token_env: TELEGRAM_BOT_TOKEN
  allowed_user_ids: []
  allowed_chat_ids: []
  allow_group_chats: false
  poll_timeout_seconds: 30
  max_steps: 40
  max_cost_usd: null
  profile: null
