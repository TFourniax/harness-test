# Replace these role models with any LiteLLM-supported provider/model IDs.
# Diversity between actor and verifier is recommended when practical.
primary:
  model: openrouter/anthropic/claude-sonnet-4.6
  temperature: 0.1
  max_tokens: 6000
  tool_mode: auto  # native | text | auto; text supports models without function calling
  fallbacks: []
  timeout: 90
  num_retries: 2
planner:
  model: openrouter/openai/gpt-5.5
  temperature: 0.0
  max_tokens: 5000
verifier:
  model: openrouter/openai/gpt-5.5
  temperature: 0.0
  max_tokens: 2000
critic:
  model: openrouter/openai/gpt-5.5
  temperature: 0.0
  max_tokens: 6000
harness_root: .
workspace: .
trace_db: .harness/traces.sqlite3
memory_db: .harness/memory.sqlite3
max_parallel_agents: 4
max_run_cost_usd: null
allowed_scopes:
  - fs:read
  - fs:write
  - net:read
  - exec:sandbox
approval_risks:
  - external_side_effect
  - privileged
evidence_gate_enabled: true
blind_verification_enabled: true
auto_maintenance_enabled: true
maintenance_scan_runs: 50
maintenance_out: .harness/proposals

# Optional human communication channel. Keep secrets in the environment, never YAML.
# A general-purpose tool-using agent must not be exposed as an open public bot.
telegram:
  enabled: false
  token_env: TELEGRAM_BOT_TOKEN
  allowed_user_ids: []  # required when enabled, e.g. [123456789]
  allowed_chat_ids: []  # optional additional restriction
  allow_group_chats: false
  poll_timeout_seconds: 30
  max_steps: 40
  max_cost_usd: null
  profile: null
