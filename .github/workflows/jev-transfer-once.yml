name: Apply exact tested JEV source once

on:
  push:
    branches: [feat/jev-decision-routing-20260918]
    paths: ['.github/jev-transfer/**']

permissions:
  contents: write

jobs:
  apply-verified-source:
    if: github.repository == 'TFourniax/harness-test' && github.ref == 'refs/heads/feat/jev-decision-routing-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply SHA256-pinned patch and verify tested Git tree
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          from pathlib import Path
          import shutil
          import subprocess
          parts = Path('.github/jev-transfer')
          data = gzip.decompress(b''.join((parts / f'{i:02d}.gzpart').read_bytes() for i in range(6)))
          assert hashlib.sha256(data).hexdigest() == 'a577e6056044f3a805d01f5642f411b5f864a6afca44ffff224c97793b5f54e9'
          patch = Path('/tmp/jev-source.patch')
          patch.write_bytes(data)
          args = ['git', 'apply', '--exclude=.github/workflows/jev-validation.yml']
          subprocess.run([*args, '--check', str(patch)], check=True)
          subprocess.run([*args, str(patch)], check=True)
          shutil.rmtree(parts)
          subprocess.run(['git', 'add', '-A'], check=True)
          helper = '.github/workflows/jev-transfer-once.yml'
          subprocess.run(['git', 'update-index', '--force-remove', helper], check=True)
          actual = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert actual == '3f5c5e964951c3af272ea71a8681b9fb20a29d5b', actual
          print('Exact tested source tree:', actual)
          # Keep the workflow unchanged during the bot push. The connector removes it afterward.
          subprocess.run(['git', 'add', helper], check=True)
          PY
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Validate exact source without live provider calls
        run: |
          python -m pytest -q --junitxml=/tmp/jev-pytest.xml
          python -m compileall -q src tests scripts
          python -m ruff check --select E9,F63,F7,F82 src tests scripts
          python scripts/eval_jev_routing.py
          sha256sum -c SOURCE_MANIFEST.sha256
      - name: Commit source only after validation and branch race check
        run: |
          set -euo pipefail
          test -z "$(git diff --cached --name-only -- '.github/workflows/*')"
          test "$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate bounded JEV decision routing; repair and verify v0.8 source'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-transfer-tests
          path: /tmp/jev-pytest.xml
          if-no-files-found: ignore
          retention-days: 14
