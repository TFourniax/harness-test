name: Finalize v0.8 docs

on:
  push:
    branches:
      - agent/import-harness-telegram
    paths:
      - ".github/v08_docs_finalize.py"
      - ".github/workflows/v08-docs-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-v08-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write final docs and remove one-shot machinery
        run: |
          set -euo pipefail
          python .github/v08_docs_finalize.py
          rm -f .github/v08_docs_finalize.py .github/workflows/v08-docs-finalize.yml

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify source before documentation commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          rm -rf src/*.egg-info
          python -m pytest -q
          python -m compileall -q src tests
          python -m ruff check --select E9,F63,F7,F82 src tests

      - name: Commit docs only if release source still verifies
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document independence-aware marginal compute v0.8"
          git push origin "HEAD:${GITHUB_REF_NAME}"
