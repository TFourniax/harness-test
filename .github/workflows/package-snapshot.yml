name: Package harness snapshot

on:
  push:
    branches:
      - agent/import-harness-telegram
    paths-ignore:
      - "artifacts/**"
      - "SOURCE_MANIFEST.sha256"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-package-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified staged v0.3 source upgrade
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G ".github/upgrade-v0.3.mod.part-*" > /dev/null; then
            cat .github/upgrade-v0.3.mod.part-* > /tmp/v0.3-mod.patch
            echo "5c8bf346d0c9cff4426c85025f60c4ed565ee1db31d3afabe096b8d8d4970f2c  /tmp/v0.3-mod.patch" | sha256sum -c -
            git apply --check --exclude=config/harness.example.yaml /tmp/v0.3-mod.patch
            git apply --exclude=config/harness.example.yaml /tmp/v0.3-mod.patch
          fi

          # config/harness.example.yaml differed slightly between the local 0.2 build
          # snapshot and the GitHub 0.2 snapshot. Apply the semantic v0.3 additions
          # deterministically rather than weakening patch validation for any other file.
          python - <<'PY'
          from pathlib import Path

          path = Path('config/harness.example.yaml')
          text = path.read_text(encoding='utf-8')

          cheap = '''# Low-cost worker/orchestrator role. GPT-5 Mini is an example; replace with any model that
# gives the best price/quality ratio for your workload.
cheap:
  model: openrouter/openai/gpt-5-mini
  temperature: 0.1
  max_tokens: 3500

'''
          if '\ncheap:\n' not in text:
              anchor = '  num_retries: 2\n'
              if anchor not in text:
                  raise SystemExit('primary role anchor not found in config/harness.example.yaml')
              text = text.replace(anchor, anchor + cheap, 1)

          team = '''# Sparse, cost-aware multi-agent team. The parent agent calls team_orchestrate only when
# decomposition/parallelism has material value. Workers never receive every peer transcript.
team:
  enabled: true
  max_agents: 6
  max_rounds: 3
  max_tasks_per_plan: 8
  worker_max_steps: 18
  orchestrator_role: cheap
  synthesizer_role: primary
  cheap_max_difficulty: 0.62
  utility_floor: 0.18
  target_confidence: 0.86
  max_report_chars: 5000
  semantic_cache_enabled: true
  semantic_cache_db: .harness/team-cache.sqlite3
  # Two-zone vector cache: direct reuse is intentionally strict; lower similarities
  # are supplied only as hints and must be re-checked by a worker.
  semantic_direct_threshold: 0.985
  semantic_reference_threshold: 0.90
  stable_cache_ttl_seconds: 604800
  volatile_cache_ttl_seconds: 600

'''
          if '\nteam:\n' not in text:
              anchor = 'maintenance_out: .harness/proposals\n'
              if anchor not in text:
                  raise SystemExit('maintenance anchor not found in config/harness.example.yaml')
              text = text.replace(anchor, anchor + '\n' + team, 1)

          path.write_text(text, encoding='utf-8')
          PY

          if compgen -G ".github/upgrade-v0.3.new.part-*" > /dev/null; then
            cat .github/upgrade-v0.3.new.part-* > /tmp/v0.3-new.patch
            echo "94185caa140518b3ff2d2093dfcd3602b6b3378122c77036db3996411892a4b2  /tmp/v0.3-new.patch" | sha256sum -c -
            git apply --check /tmp/v0.3-new.patch
            git apply /tmp/v0.3-new.patch
          fi
          rm -f .github/upgrade-v0.3.mod.part-* .github/upgrade-v0.3.new.part-* .github/upgrade-v0.3.patch.gz

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Resolve package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          PY
          )"
          echo "HARNESS_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "HARNESS_ZIP=artifacts/adaptive-agent-harness-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Verify source snapshot
        run: |
          python -m pytest -q
          python -m compileall -q src tests
          python -m ruff check --select E9,F63,F7,F82 src tests

      - name: Build source manifest and deterministic ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/package-verify
          mkdir -p artifacts
          rm -f "$HARNESS_ZIP" "$HARNESS_ZIP.sha256" SOURCE_MANIFEST.sha256

          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          exclude_top = {'.git', '.venv', '.pytest_cache', '.ruff_cache', '.harness', 'artifacts'}
          files = []
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              rel = p.relative_to(root)
              if rel.parts[0] in exclude_top:
                  continue
              if rel.name == 'SOURCE_MANIFEST.sha256':
                  continue
              if '__pycache__' in rel.parts or rel.suffix == '.pyc':
                  continue
              files.append(rel)

          lines = []
          for rel in sorted(files, key=lambda p: p.as_posix()):
              digest = hashlib.sha256((root / rel).read_bytes()).hexdigest()
              lines.append(f'{digest}  {rel.as_posix()}')
          (root / 'SOURCE_MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'manifest_files={len(files)}')
          PY

          python - <<'PY'
          from pathlib import Path
          import os
          import zipfile

          root = Path('.').resolve()
          out = root / os.environ['HARNESS_ZIP']
          exclude_top = {'.git', '.venv', '.pytest_cache', '.ruff_cache', '.harness', 'artifacts'}
          files = []
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              rel = p.relative_to(root)
              if rel.parts[0] in exclude_top:
                  continue
              if '__pycache__' in rel.parts or rel.suffix == '.pyc':
                  continue
              files.append(rel)

          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for rel in sorted(files, key=lambda p: p.as_posix()):
                  data = (root / rel).read_bytes()
                  info = zipfile.ZipInfo(rel.as_posix(), date_time=(2020, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  z.writestr(info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          print(f'zip_bytes={out.stat().st_size}')
          PY

          sha256sum "$HARNESS_ZIP" > "$HARNESS_ZIP.sha256"

      - name: Re-extract and retest packaged archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/package-verify
          mkdir -p artifacts/package-verify
          unzip -q "$HARNESS_ZIP" -d artifacts/package-verify
          (
            cd artifacts/package-verify
            python -m pytest -q
            python -m compileall -q src tests
            python -m ruff check --select E9,F63,F7,F82 src tests
          )
          rm -rf artifacts/package-verify

      - name: Commit verified source and binary snapshot to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Verified package is already current."
            exit 0
          fi
          git commit -m "Implement verified harness ${HARNESS_VERSION} snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
