name: Finalize v0.6 source

on:
  push:
    branches:
      - agent/import-harness-telegram
    paths:
      - ".github/v06_finalize.py"
      - ".github/v06_contract_fix.py"
      - ".github/workflows/v06-finalize.yml"
      - "src/adaptive_harness/orchestration/policy_arena.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-v06:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded v0.6 finalization
        run: |
          set -euo pipefail
          python .github/v06_finalize.py
          python .github/v06_contract_fix.py
          rm -f .github/v06_finalize.py .github/v06_contract_fix.py .github/workflows/v06-finalize.yml

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and verify complete v0.6 source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          rm -rf src/*.egg-info
          python -m pytest -q
          python -m compileall -q src tests
          python -m ruff check --select E9,F63,F7,F82 src tests

      - name: Commit direct-source v0.6 only if verified
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize durable mission plane v0.6"
          git push origin "HEAD:${GITHUB_REF_NAME}"
